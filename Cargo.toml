[workspace]
resolver = "3"
members = [
    "crates/acan-core",
    "crates/acan-droid",
    "crates/acan-git",
    "crates/acan-hook",
    "crates/acan-intent",
    "crates/acan-layout",
    "crates/acan-scan",
    "crates/acan-server",
    "crates/acan-witness",
]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/NDilanka/acan"

[workspace.dependencies]
tokio = { version = "1.54.1", features = ["full"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
anyhow = "1.0.104"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = { version = "1.29.0", features = ["v4", "serde"] }
