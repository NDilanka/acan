[package]
name = "acan-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "The acan binary: one world's origin served over HTTP and WebSocket, with its event log in SQLite"

[[bin]]
name = "acan"
path = "src/main.rs"

[dependencies]
acan-core = { path = "../acan-core" }
acan-droid = { path = "../acan-droid" }
acan-git = { path = "../acan-git" }
acan-hook = { path = "../acan-hook" }
acan-intent = { path = "../acan-intent" }
acan-scan = { path = "../acan-scan" }
acan-witness = { path = "../acan-witness" }
anyhow.workspace = true
axum = { version = "0.8", features = ["ws"] }
clap = { version = "4", features = ["derive"] }
dotenvy = "0.15"
percent-encoding = "2"
regex = "1"
reqwest = { version = "0.12", features = ["json"] }
semver = "1"
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
thiserror.workspace = true
tempfile = "3"
tokio.workspace = true
tower = { version = "0.5", default-features = false, features = ["util"] }
tower-http = { version = "0.6", features = ["fs"] }
toml = "0.8"
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"
rustix = { version = "1", features = ["fs", "process"] }

[dev-dependencies]
futures-util = "0.3"
tokio-tungstenite = "0.29"
wiremock = "0.6"
