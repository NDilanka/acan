name: Release

# Runs on a version tag, such as v0.1.0-alpha.1. It builds the acan binary for each platform,
# bundles the web UI, and attaches the archives and SHA256SUMS to a pre-release. macOS builds are
# untested: they are published with that label in the release notes.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  # The version the binary reports and the update check compares against.
  ACAN_VERSION: ${{ github.ref_name }}
  ACAN_COMMIT: ${{ github.sha }}

jobs:
  web:
    name: web UI bundle
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129
      - uses: Swatinem/rust-cache@v2
      # The same size-tuned profile as crates/acan-render-web/build.ps1.
      - name: Build the wasm module
        env:
          CARGO_PROFILE_RELEASE_OPT_LEVEL: s
          CARGO_PROFILE_RELEASE_LTO: "true"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
          CARGO_PROFILE_RELEASE_PANIC: abort
        run: cargo build -p acan-render-web --release --locked --target wasm32-unknown-unknown
      - name: Generate the JavaScript bindings
        run: |
          wasm-bindgen --target web --no-typescript \
            --out-dir crates/acan-render-web/www/pkg \
            target/wasm32-unknown-unknown/release/acan_render_web.wasm
      - name: Assemble the web directory
        run: |
          mkdir -p dist/web
          cp -r crates/acan-render-web/www/. dist/web/
          rm -f dist/web/.gitignore
          ls -la dist/web dist/web/pkg
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: dist/web
          if-no-files-found: error

  build:
    name: build ${{ matrix.target }}${{ matrix.untested && ' (untested)' || '' }}
    needs: web
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
            untested: true
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
            untested: true
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - uses: actions/download-artifact@v4
        with:
          name: web
          path: dist/web
      - name: Build acan
        run: cargo build -p acan-server --bin acan --release --locked --target ${{ matrix.target }}
      - name: Package (unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          name="acan-${{ matrix.target }}"
          stage="dist/$name"
          mkdir -p "$stage"
          cp "target/${{ matrix.target }}/release/acan" "$stage/acan"
          cp -r dist/web "$stage/web"
          cp README.md LICENSE "$stage/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
      - name: Package (windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $name = "acan-${{ matrix.target }}"
          $stage = "dist/$name"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/acan.exe" "$stage/acan.exe"
          Copy-Item -Recurse "dist/web" "$stage/web"
          Copy-Item README.md, LICENSE "$stage/"
          Compress-Archive -Path $stage -DestinationPath "dist/$name.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: acan-${{ matrix.target }}
          path: dist/acan-${{ matrix.target }}.${{ matrix.archive }}
          if-no-files-found: error

  release:
    name: publish pre-release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: acan-*
          path: archives
          merge-multiple: true
      - name: Checksums
        working-directory: archives
        run: sha256sum acan-* > SHA256SUMS && cat SHA256SUMS
      - name: Publish the pre-release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            Alpha build. The macOS archives (aarch64 and x86_64) are built in CI but untested.
          files: |
            archives/acan-*
            archives/SHA256SUMS
