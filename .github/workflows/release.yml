name: Release

# Runs on a version tag, such as v0.1.0-alpha.1. It builds the acan binary for each platform,
# bundles the web UI, and attaches the archives and SHA256SUMS to a pre-release. macOS builds are
# untested: they are published with that label in the release notes.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  # The version the binary reports and the update check compares against.
  ACAN_VERSION: ${{ github.ref_name }}
  ACAN_COMMIT: ${{ github.sha }}

jobs:
  web:
    name: web UI bundle
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2
        with:
          tool: wasm-bindgen@0.2.129
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      # The same size-tuned profile as crates/acan-render-web/build.ps1.
      - name: Build the wasm module
        env:
          CARGO_PROFILE_RELEASE_OPT_LEVEL: s
          CARGO_PROFILE_RELEASE_LTO: "true"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
          CARGO_PROFILE_RELEASE_PANIC: abort
        run: cargo build -p acan-render-web --release --locked --target wasm32-unknown-unknown
      - name: Generate the JavaScript bindings
        run: |
          wasm-bindgen --target web --no-typescript \
            --out-dir crates/acan-render-web/www/pkg \
            target/wasm32-unknown-unknown/release/acan_render_web.wasm
      - name: Assemble the web directory
        run: |
          mkdir -p dist/web
          cp -r crates/acan-render-web/www/. dist/web/
          rm -f dist/web/.gitignore
          ls -la dist/web dist/web/pkg
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web
          path: dist/web
          if-no-files-found: error

  build:
    name: build ${{ matrix.target }}${{ matrix.untested && ' (untested)' || '' }}
    needs: web
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
            untested: true
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
            untested: true
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ matrix.target }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: web
          path: dist/web
      - name: Build acan
        run: cargo build -p acan-server --bin acan --release --locked --target ${{ matrix.target }}
      - name: Build acan-worker
        run: cargo build -p acan-agent --bin acan-worker --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: pwsh
        run: pwsh ./scripts/package.ps1 -Target ${{ matrix.target }} -BinDir target/${{ matrix.target }}/release -WebDir dist/web -OutDir dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: acan-${{ matrix.target }}
          path: dist/acan-${{ matrix.target }}.${{ matrix.archive }}
          if-no-files-found: error

  release:
    name: publish pre-release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: acan-*
          path: archives
          merge-multiple: true
      - name: Checksums
        working-directory: archives
        run: sha256sum acan-* > SHA256SUMS && cat SHA256SUMS
      - name: Publish the pre-release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          prerelease: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            Alpha build. The macOS archives (aarch64 and x86_64) are built in CI but untested.
          files: |
            archives/acan-*
            archives/SHA256SUMS
